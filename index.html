<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hahahafunny</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101014; color: #f5f5f7; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2.5rem, 9vw, 6rem); margin: 0; letter-spacing: -.06em; }
    p { color: #aaaab5; font-size: 1.1rem; }
    button { margin-top: 1rem; padding: .85rem 1.2rem; border: 0; border-radius: .7rem; background: #f5f5f7; color: #101014; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>hahahafunny</h1>
    <p>the website is doing website things.</p>
    <button id="surprise">Open surprise</button>
  </main>
  <script>
    document.getElementById("surprise").addEventListener("click", () => {
      const popup = window.open(new URL("feet.png", window.location.href).href, "feetPopup", "width=640,height=480,resizable=yes,scrollbars=yes");
      if (!popup) {
        alert("Your browser blocked the popup. Allow popups for this site and try again.");
      }
    });
  </script>
</body>
</html>
